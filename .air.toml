# Air configuration for hot reload
# Install: go install github.com/air-verse/air@latest
# Run: air -c .air.toml

root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/pdfgen"
  cmd = "go build -o ./tmp/pdfgen ./cmd/pdfgen"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", ".git"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = true
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true